name: Test Build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $USER:$USER /opt/theos
          cd /opt/theos
          git clone --depth 1 https://github.com/theos/theos.git .
      
      - name: Download iOS SDK
        run: |
          cd /opt/theos/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xf iPhoneOS16.5.sdk.tar.xz
      
      - name: Update Theos submodules
        run: |
          cd /opt/theos
          git submodule update --init vendor
      
      - name: Check THEOS
        run: |
          echo "THEOS=$THEOS"
          echo "THEOS exists: $([ -d "$THEOS" ] && echo 'yes' || echo 'no')"
          echo "SDk exists: $([ -d "$THEOS/sdks" ] && echo 'yes' || echo 'no')"
          ls -la $THEOS/sdks/
      
      - name: Build package
        run: |
          cd $THEOS
          make clean
          make package
      
      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: AxsWeChatMoments-deb
          path: $THEOS/local/debs/*/AxsWeChatMoments_*.deb
